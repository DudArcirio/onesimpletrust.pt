<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilotis — entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/pilotis.css">
<style>
  body{background:var(--sombra);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .box{background:var(--luz);border-radius:18px;padding:38px 40px;width:min(420px,92vw);animation:up .3s var(--ease)}
  .field{margin:14px 0}
  .field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);display:block;margin-bottom:6px}
  .field input{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 13px;font-family:var(--sans);font-size:14.5px;background:#fff;outline:none;transition:border-color var(--dur) var(--ease)}
  .field input:focus{border:1.5px solid var(--verde)}
  .who{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:12px 14px;margin:18px 0 4px}
  .who .av{width:40px;height:40px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
  .err{color:var(--sinal);font-size:12.5px;display:none;margin-top:8px}
</style>
</head>
<body>
<div id="back-to-tools" style="position:fixed;top:0;left:0;right:0;z-index:9999;background:rgba(11,15,20,0.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(200,169,110,0.15);padding:12px 24px;display:flex;align-items:center;gap:16px;font-family:Inter,-apple-system,sans-serif;"><a href="/tools.html" style="color:#C8A96E;text-decoration:none;font-size:13px;font-weight:400;letter-spacing:0.5px;display:flex;align-items:center;gap:6px;"><span style="font-size:16px;">&#8592;</span> Back to Tools</a><span style="color:rgba(200,169,110,0.3);">|</span><a href="/index.html" style="color:#8A8680;text-decoration:none;font-size:13px;">Home</a></div><div style="height:48px;"></div>
<div class="box">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
    <span id="mark"></span>
    <div><b style="font-size:20px">pilotis</b>
    <div class="mono" style="font-size:9px;letter-spacing:.2em;color:var(--verde)">RIG · OS</div></div>
  </div>
  <div class="mut" style="font-size:13.5px">Acesso à plataforma. O vão é seu.</div>

  <div class="who">
    <div class="av">VE</div>
    <div><b style="font-size:14.5px">Vinicius Emanuel</b>
    <div class="mono" style="font-size:10.5px;color:var(--text2)">CONSULTOR SÊNIOR DE RIG</div></div>
  </div>

  <form id="f">
    <div class="field"><label for="em">E-mail</label>
      <input id="em" type="email" value="vinicius.emanuel@pilotis.io" autocomplete="username"></div>
    <div class="field"><label for="pw">Senha</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password" autofocus></div>
    <button class="btn btn-primary" type="submit" style="width:100%;margin-top:10px">Entrar →</button>
    <div class="err" id="err">Informe a senha para entrar.</div>
  </form>
  <div class="mut mono" style="font-size:10px;margin-top:18px;text-align:center">AMBIENTE DE DEMONSTRAÇÃO · DADOS PÚBLICOS</div>
</div>

<script src="assets/app.js"></script>
<script>
  document.getElementById('mark').innerHTML = cobogoSVG(40, false);
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!document.getElementById('pw').value.trim()) {
      document.getElementById('err').style.display = 'block';
      return;
    }
    sessao.set({ nome: 'Vinicius Emanuel', papel: 'Consultor Sênior de RIG', iniciais: 'VE' });
    location.href = 'welcome.html';
  });
</script>
</body>
</html>
