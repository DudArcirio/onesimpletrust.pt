<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>noise.os — SaaS Revenue System Navigator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0e1a;--bgCard:#111827;--bgAlt:#1a2234;--bgHov:#1e293b;--accent:#3b82f6;--accentL:#60a5fa;--success:#10b981;--successL:#34d399;--warn:#f59e0b;--warnL:#fbbf24;--danger:#ef4444;--dangerL:#f87171;--purple:#8b5cf6;--purpleL:#a78bfa;--pink:#ec4899;--cyan:#06b6d4;--text:#f1f5f9;--textDim:#94a3b8;--textMut:#64748b;--border:#1e293b;--gold:#d4a017;--sans:'Inter',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--text);background:var(--bg);overflow-x:hidden}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.top-bar{padding:10px 16px;background:linear-gradient(135deg,var(--bgCard),var(--bgAlt));border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo{font-size:14px;font-weight:800;letter-spacing:-.3px}.logo span{color:var(--textMut);font-weight:400;font-size:12px}
.lt-bar{background:var(--bgCard);border-bottom:1px solid var(--border);padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.lt{padding:10px 12px;border:none;cursor:pointer;background:transparent;border-bottom:2px solid transparent;color:var(--textMut);font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;transition:all .2s;white-space:nowrap;font-family:var(--sans)}
.lt:hover{color:var(--textDim)}.lt.on{border-bottom-color:var(--accent);color:var(--accent)}
.wrap{display:flex;height:calc(100vh - 88px)}
.content{flex:1;overflow-y:auto;padding:16px}
.side{width:340px;flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;background:rgba(12,16,30,.97);backdrop-filter:blur(20px)}
.side-inner{padding:20px}
.side-empty{font-size:11px;color:var(--textMut);line-height:1.7;padding:24px 0}
.sec{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--textMut);margin:14px 0 6px;font-weight:700}.sec:first-child{margin-top:0}
h2{font-size:15px;font-weight:800;margin-bottom:4px;letter-spacing:-.2px}
.desc{font-size:12px;color:var(--textDim);line-height:1.6;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
/* CLD-specific */
.cld-wrap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--bg)}
.cld-svg{width:100%;height:640px;display:block}
.cld-legend{position:absolute;bottom:12px;left:14px;display:flex;flex-wrap:wrap;gap:10px}
.cld-legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--textMut)}
.cld-legend-dot{width:8px;height:8px;border-radius:4px}
.cld-info{position:absolute;bottom:12px;right:14px;font-size:10px;color:#3e4658}
.cld-filters{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.cld-filter-label{font-size:12px;font-weight:700;color:var(--textDim);margin-right:4px}
.cld-fbtn{padding:5px 14px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--textMut);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--sans)}
.cld-fbtn:hover{background:rgba(255,255,255,.06)}.cld-fbtn.on{color:#fff}
/* Sidebar node card */
.sn-group{display:inline-flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:12px}
.sn-title{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.3px;margin-bottom:8px;line-height:1.3}
.sn-detail{font-size:13px;color:var(--textMut);line-height:1.6;margin-bottom:6px}
.sn-meta{display:flex;gap:16px;margin-top:12px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.sn-meta-item{display:flex;flex-direction:column;gap:2px}
.sn-meta-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#4a5268;font-weight:600}
.sn-meta-val{font-size:14px;font-weight:600;color:var(--textDim)}
.sn-sec{padding:16px 0;border-bottom:1px solid rgba(30,41,59,.3)}
.sn-sec:last-child{border:none}
.sn-sec-title{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#4a5268;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sn-sec-count{background:rgba(255,255,255,.06);padding:1px 7px;border-radius:8px;font-size:10px;color:#6a7488}
.sn-edge{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:4px;border-radius:8px;background:rgba(255,255,255,.02);cursor:pointer;transition:background .15s}
.sn-edge:hover{background:rgba(255,255,255,.05)}
.sn-edge-dot{width:8px;height:8px;border-radius:4px;flex-shrink:0}
.sn-edge-name{font-size:12px;font-weight:600;color:#d0d8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn-edge-label{font-size:10px;color:#5a6478;margin-top:1px}
.sn-edge-pol{font-size:11px;font-weight:700}
.pol-s{color:var(--success)}.pol-o{color:var(--danger)}
.sn-edge-dir{font-size:11px;color:#3a4258}
/* Cross-layer links */
.cl{font-size:11px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.03);margin:3px 0;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
.cl:hover{background:rgba(255,255,255,.06)}
.cl-layer{font-size:8px;color:var(--textMut);text-transform:uppercase;letter-spacing:.5px;min-width:45px}
.cl-name{font-weight:600;color:var(--textDim)}
/* Loop chain */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:8px 0}
.chain-v{padding:3px 8px;border-radius:5px;font-weight:600;font-size:9px}
.chain-a{color:var(--textMut);font-size:10px}
/* Other layers */
.opt-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.opt-card{border-radius:12px;padding:16px;border:1px solid var(--border);background:var(--bgCard);cursor:pointer;transition:all .2s}
.opt-card:hover{border-color:var(--textMut)}.opt-card.on{border-color:var(--accent);border-width:2px}
.opt-card-name{font-size:13px;font-weight:700;margin-bottom:3px}
.opt-card-q{font-size:10px;color:var(--textMut);font-style:italic;margin-bottom:6px}
.opt-kpi{font-size:10px;color:var(--textDim);padding:2px 0}
.opt-north{font-size:11px;font-weight:700;margin-top:6px}
.matrix{display:grid;grid-template-columns:110px repeat(4,1fr);gap:1px;background:var(--border);border-radius:12px;overflow:hidden;margin:10px 0}
.mx-cell{background:var(--bgCard);padding:10px;font-size:10px;line-height:1.5;cursor:pointer;transition:background .15s}
.mx-cell:hover{background:var(--bgHov)}.mx-cell.on{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
.mx-head{background:var(--bgAlt);font-weight:600;font-size:9px;text-align:center;padding:8px 6px}
.mx-row-head{background:var(--bgAlt);font-weight:600;font-size:9px;display:flex;align-items:center;padding:8px 10px}
.mx-metric{font-size:9px;color:var(--textMut);margin-top:3px}
.tag{display:inline-block;padding:2px 6px;border-radius:4px;font-size:8px;font-weight:600;margin:1px;border:1px solid}
.org-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.org-card{border-radius:12px;padding:14px;border:1px solid var(--border);background:var(--bgCard);cursor:pointer;transition:all .2s}
.org-card:hover{border-color:var(--textMut)}.org-card.on{border-color:var(--accent);border-width:2px}
.org-title{font-size:13px;font-weight:700;margin-bottom:3px}
.org-sub{font-size:9px;color:var(--textMut);margin-bottom:6px}
.org-body{font-size:10px;color:var(--textDim);line-height:1.5}
.org-badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:9px;font-weight:700;margin-bottom:8px}
.fn-box{background:var(--bgCard);border-radius:12px;padding:16px 20px;margin:12px 0;border-left:3px solid var(--accent)}
.fn-eq{font-family:Georgia,serif;font-size:14px;color:var(--text);padding:12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin:8px 0;line-height:1.8}
/* Simulator */
.sim-layout{display:grid;grid-template-columns:260px 1fr;gap:12px;margin:12px 0}
.sim-panel{background:var(--bg);border-radius:12px;border:1px solid var(--border);padding:14px;max-height:700px;overflow-y:auto}
.sim-charts{display:flex;flex-direction:column;gap:10px}
.sim-chart{background:var(--bg);border-radius:12px;border:1px solid var(--border);padding:14px}
.sim-chart-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--textMut);margin-bottom:8px}
.sim-chart canvas{height:160px!important;width:100%!important}
.sim-lever{margin-bottom:12px}
.sim-lever-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.sim-lever-name{font-size:10px;font-weight:600;color:var(--textDim)}
.sim-lever-val{font-size:11px;font-weight:700}
.sim-slider{width:100%;height:4px;border-radius:2px;-webkit-appearance:none;appearance:none;background:var(--bgCard);outline:none;cursor:pointer}
.sim-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:6px;background:#fff;border:2px solid var(--accent);cursor:pointer}
.sim-slider::-moz-range-thumb{width:12px;height:12px;border-radius:6px;background:#fff;border:2px solid var(--accent);cursor:pointer}
.sim-lever-desc{font-size:8px;color:var(--textMut);margin-top:1px;line-height:1.3}
.sc-btns{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:10px}
.sc-btn{padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--textMut);font-size:9px;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--sans)}
.sc-btn:hover{background:rgba(255,255,255,.05)}.sc-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sim-run{width:100%;padding:8px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--accent),var(--purple));color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:var(--sans);margin-top:8px}
.sim-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.sim-metric{background:var(--bgAlt);border-radius:8px;padding:8px 10px}
.sim-metric-label{font-size:8px;color:var(--textMut);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.sim-metric-val{font-size:16px;font-weight:800;margin-top:1px;line-height:1.1}
.sim-metric-delta{font-size:9px;font-weight:700;margin-top:1px}
.up{color:var(--success)}.down{color:var(--danger)}.flat{color:var(--textMut)}
@media(max-width:900px){.wrap{flex-direction:column;height:auto}.side{width:100%;border-left:none;border-top:1px solid var(--border)}.org-grid,.opt-cards{grid-template-columns:1fr}.sim-layout{grid-template-columns:1fr}.sim-metrics{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

function buildD3Graph(){
const svg=d3.select('#cld-svg');if(svg.empty())return;
svg.selectAll('*').remove();
const W=960,H=640;
svg.attr('viewBox',`0 0 ${W} ${H}`);
const defs=svg.append('defs');
// Glow filter
const glow=defs.append('filter').attr('id','glow');
glow.append('feGaussianBlur').attr('stdDeviation','3').attr('result','blur');
const merge=glow.append('feMerge');merge.append('feMergeNode').attr('in','blur');merge.append('feMergeNode').attr('in','SourceGraphic');
// Arrow markers per color
const colors=new Set();V.forEach(n=>colors.add(n.c));
colors.forEach(col=>{
const cid=col.replace(/[^a-zA-Z0-9]/g,'');
defs.append('marker').attr('id',`arr-${cid}`).attr('viewBox','0 -4 8 8').attr('refX',8).attr('refY',0).attr('markerWidth',6).attr('markerHeight',6).attr('orient','auto')
.append('path').attr('d','M0,-3.5L8,0L0,3.5').attr('fill',col).attr('fill-opacity',.6);
});
const g=svg.append('g');
// Zoom
const zoom=d3.zoom().scaleExtent([.3,3]).on('zoom',e=>g.attr('transform',e.transform));
svg.call(zoom);
// Clone data
const nodes=V.map(n=>({...n,size:n.r}));
const edges=Ed.map(e=>({source:e.f,target:e.t,label:e.n,pol:e.p,loops:e.L}));
// Simulation
const sim=d3.forceSimulation(nodes)
.force('link',d3.forceLink(edges).id(d=>d.id).distance(80))
.force('charge',d3.forceManyBody().strength(-280))
.force('center',d3.forceCenter(W/2,H/2))
.force('collision',d3.forceCollide().radius(d=>d.size+14))
.force('x',d3.forceX(d=>d.x*W).strength(.15))
.force('y',d3.forceY(d=>d.y*H).strength(.15));
// Pre-compute curve offsets for parallel/bidirectional edges
const edgePairs={};
edges.forEach((e,i)=>{
const a=eid(e,'s'),b=eid(e,'t');
const key=[a,b].sort().join('|');
if(!edgePairs[key])edgePairs[key]=[];
edgePairs[key].push(i);
});
edges.forEach((e,i)=>{
const a=eid(e,'s'),b=eid(e,'t');
const key=[a,b].sort().join('|');
const group=edgePairs[key];
const idx=group.indexOf(i);
const count=group.length;
if(count===1){e._curve=0.12;}// slight curve even for single edges
else{
const spread=0.15;
e._curve=spread*(idx-(count-1)/2)*2 + (a<b?0.08:-0.08);
}
});
// Links as bezier paths
const linkG=g.append('g');
const link=linkG.selectAll('path').data(edges).join('path')
.attr('fill','none')
.attr('stroke',d=>{const src=nodes.find(n=>n.id===(typeof d.source==='string'?d.source:d.source.id));return src?src.c:C.border;})
.attr('stroke-width',.8).attr('stroke-opacity',.25)
.attr('marker-end',d=>{const src=nodes.find(n=>n.id===(typeof d.source==='string'?d.source:d.source.id));return src?`url(#arr-${src.c.replace(/[^a-zA-Z0-9]/g,'')})`:'';});
// Helper: compute bezier control point and endpoint
function bezierCalc(d){
const sx=d.source.x,sy=d.source.y,tx=d.target.x,ty=d.target.y;
const dx=tx-sx,dy=ty-sy,dist=Math.sqrt(dx*dx+dy*dy)||1;
// Normal vector (perpendicular)
const nx=-dy/dist,ny=dx/dist;
// Control point offset
const off=dist*d._curve;
const cx=((sx+tx)/2)+nx*off, cy=((sy+ty)/2)+ny*off;
// Shorten endpoint to stop at target node edge
const tdx=tx-cx,tdy=ty-cy,tdist=Math.sqrt(tdx*tdx+tdy*tdy)||1;
const ex=tx-(tdx/tdist)*(d.target.size+6), ey=ty-(tdy/tdist)*(d.target.size+6);
// Bezier midpoint (t=0.5): B(0.5) = 0.25*S + 0.5*C + 0.25*T
const mx=0.25*sx+0.5*cx+0.25*tx, my=0.25*sy+0.5*cy+0.25*ty;
// Point at t=0.7 for polarity indicator
const t7=0.7;
const px=(1-t7)*(1-t7)*sx+2*(1-t7)*t7*cx+t7*t7*tx;
const py=(1-t7)*(1-t7)*sy+2*(1-t7)*t7*cy+t7*t7*ty;
return {sx,sy,cx,cy,ex,ey,mx,my,px,py};
}
// Edge labels
const eLabelG=g.append('g');
const eLabelGrp=eLabelG.selectAll('g').data(edges).join('g').style('opacity',0);
eLabelGrp.append('rect').attr('fill','rgba(10,14,26,.85)').attr('rx',4);
eLabelGrp.append('text').attr('text-anchor','middle').attr('fill',C.textDim).attr('font-size',9).attr('font-weight',500).attr('dy',3).text(d=>d.label||'');
// Polarity indicator on edge
const polG=g.append('g');
const polGrp=polG.selectAll('g').data(edges).join('g').style('opacity',0);
polGrp.append('circle').attr('r',6).attr('fill',C.bg).attr('stroke',d=>d.pol==='o'?C.danger:C.success).attr('stroke-width',1);
polGrp.append('text').attr('text-anchor','middle').attr('dominant-baseline','central').attr('fill',d=>d.pol==='o'?C.danger:C.success).attr('font-size',8).attr('font-weight',700).text(d=>d.pol);
// Nodes
const nodeG=g.append('g');
const node=nodeG.selectAll('g').data(nodes).join('g');
// Outer glow circle
node.append('circle').attr('r',d=>d.size).attr('fill',d=>d.c).attr('fill-opacity',.15).attr('stroke',d=>d.c).attr('stroke-width',1.5).attr('stroke-opacity',.6).style('filter','url(#glow)').style('cursor','pointer');
// Inner dot
node.append('circle').attr('r',d=>d.size*.3).attr('fill',d=>d.c).attr('fill-opacity',.6).style('pointer-events','none');
// Labels
node.each(function(d){
const lines=d.l.split('\n');
d3.select(this).append('text').attr('text-anchor','middle').attr('fill',C.textDim).attr('font-size',d.size>20?10:9).attr('font-weight',500).attr('dy',d.size+14).style('pointer-events','none').style('text-shadow','0 1px 4px rgba(0,0,0,.8),0 0 8px rgba(0,0,0,.6)')
.selectAll('tspan').data(lines).join('tspan').attr('x',0).attr('dy',(l,i)=>i===0?0:12).text(l=>l);
});
// Helpers
function eid(e,w){const v=w==='s'?e.source:e.target;return typeof v==='string'?v:v.id;}
function getConnected(d){const c=new Set();edges.forEach(e=>{const s=eid(e,'s'),t=eid(e,'t');if(s===d.id)c.add(t);if(t===d.id)c.add(s);});c.add(d.id);return c;}

// State: multi-select loops + optional pinned node
let dragging=false;

// Combined state renderer — merges loop highlights + node highlights
function applyState(hoverNode){
const aLoops=[...activeLoops];
const hasLoops=aLoops.length>0;
const focusNode=hoverNode||pinned;
const hasNode=!!focusNode;
const any=hasLoops||hasNode;

// Compute highlighted sets
const hlNodes=new Set(),hlEdges=new Set();
const loopEdgeColors={};

// From loops
if(hasLoops){
aLoops.forEach(lid=>{
const l=loops.find(x=>x.id===lid);if(!l)return;
edges.forEach((e,i)=>{if(e.loops.includes(lid)){hlEdges.add(i);hlNodes.add(eid(e,'s'));hlNodes.add(eid(e,'t'));loopEdgeColors[i]=l.c;}});
});
}

// From node
const nodeConn=focusNode?getConnected(focusNode):new Set();
if(hasNode){
nodeConn.forEach(nid=>hlNodes.add(nid));
edges.forEach((e,i)=>{if(eid(e,'s')===focusNode.id||eid(e,'t')===focusNode.id)hlEdges.add(i);});
}

// Apply to nodes
node.select('circle:first-child')
.attr('fill-opacity',n=>{
if(!any)return .15;
const inLoop=hasLoops&&hlNodes.has(n.id);
const inNode=hasNode&&nodeConn.has(n.id);
const isPinned=focusNode&&n.id===focusNode.id;
if(isPinned)return .5;
if(inNode&&inLoop)return .45;

// ==================== SYSTEM DYNAMICS SIMULATOR ====================
const SIM_MONTHS=24;
const SIM_INIT={brand_awareness:50,product_awareness:40,product_quality:55,content_quality:40,brand_consistency:45,partnership_ecosystem:30,feature_adoption:35,switching_costs:25,social_proof:40,detractor_volume:15,advocacy:35,acquisition_volume:50,acquisition_quality:50,activation_depth:45,conversion_rate:30,revenue:50,retention_rate:85,expansion_revenue:20,perceived_value:55,value_price_gap:20,onboarding_friction:45,signup_friction:35,customer_base:50,product_complexity:30,channel_saturation:20,partner_mgmt_load:15};
function cl(v){return Math.max(0,Math.min(100,v));}
function sm(cur,tgt,a){return cur+a*(tgt-cur);}
function dimret(x,k=50){return 100*x/(x+k);}
function simulate(L){
const hist=[];const S={...SIM_INIT};
for(let m=0;m<SIM_MONTHS;m++){
const prodInvest=L.pi,channelInvest=L.ci,contentInvest=L.cqi,partnerInvest=L.pei,pricingLevel=L.pl,supportQuality=L.sq,regPressure=L.rp,compAlt=L.ca,custGrowth=L.cg;
// B4: customer base dampens product quality growth
const cbBrake=Math.max(0.5,1-S.customer_base/200);
S.product_quality=cl(sm(S.product_quality,dimret(prodInvest*1.2*cbBrake,50),0.08));
S.content_quality=cl(sm(S.content_quality,dimret(contentInvest*1.1,45),0.1));
S.brand_consistency=cl(sm(S.brand_consistency,(channelInvest*0.3+contentInvest*0.3+S.brand_awareness*0.4),0.05));
S.partnership_ecosystem=cl(sm(S.partnership_ecosystem,dimret(partnerInvest*1.3,40),0.06));
// B5: complexity tax
S.product_complexity=cl(sm(S.product_complexity,prodInvest*0.6+S.product_complexity*0.3,0.07));
S.onboarding_friction=cl(100-S.product_quality*0.7+S.product_complexity*0.25-15);
S.signup_friction=cl(100-S.product_quality*0.6-30);
S.feature_adoption=cl(sm(S.feature_adoption,S.product_quality*0.7+S.content_quality*0.15,0.08));
S.switching_costs=cl(sm(S.switching_costs,S.feature_adoption*0.5+S.partnership_ecosystem*0.35,0.06));
// Awareness — detractors dampen (R6), content/channels drive (R10,R11)
const bawGain=channelInvest*0.25+S.content_quality*0.15+S.brand_consistency*0.15+S.advocacy*0.1+regPressure*0.08;
const bawLoss=S.detractor_volume*0.12;
S.brand_awareness=cl(sm(S.brand_awareness,bawGain-bawLoss+S.perceived_value*0.08,0.1));
S.product_awareness=cl(sm(S.product_awareness,S.content_quality*0.4+channelInvest*0.3+S.brand_awareness*0.15,0.12));
// B7: channel saturation
S.channel_saturation=cl(sm(S.channel_saturation,channelInvest*0.7,0.08));
// B8: partner management load
S.partner_mgmt_load=cl(sm(S.partner_mgmt_load,S.partnership_ecosystem*0.6,0.07));
// B2: market saturation — customer base limits acquisition
const mktCap=Math.max(0.3,1-S.customer_base/180);
S.acquisition_volume=cl(S.brand_awareness*0.25+S.product_awareness*0.2+S.partnership_ecosystem*0.2+channelInvest*0.15-S.signup_friction*0.1)*mktCap;
// B7+B8 degrade acquisition quality
S.acquisition_quality=cl(S.brand_awareness*0.25+S.product_awareness*0.3+S.partnership_ecosystem*0.15-S.detractor_volume*0.15-S.channel_saturation*0.1-S.partner_mgmt_load*0.08+5);
S.activation_depth=cl(S.acquisition_quality*0.25+S.product_quality*0.2-S.onboarding_friction*0.25+S.content_quality*0.15+15);
const pvTarget=S.product_quality*0.3+S.activation_depth*0.2+supportQuality*0.15+regPressure*0.1+S.feature_adoption*0.1;
S.perceived_value=cl(sm(S.perceived_value,pvTarget,0.12));
S.value_price_gap=cl(pricingLevel-S.perceived_value*0.85+15);
// B6: competitive response
const compEff=compAlt+S.customer_base*0.12;
S.conversion_rate=cl(S.activation_depth*0.25+S.social_proof*0.15-compEff*0.12-S.value_price_gap*0.2+regPressure*0.1+10);
// B3: support capacity — customer base degrades support
const effSupport=cl(supportQuality-S.customer_base*0.15);
const rrTarget=S.perceived_value*0.3+S.switching_costs*0.2+effSupport*0.15-S.value_price_gap*0.25-compEff*0.08+40;

S.advocacy=cl(sm(S.advocacy,cl(S.perceived_value*0.35+S.retention_rate*0.3-20),0.08));
S.social_proof=cl(sm(S.social_proof,S.advocacy*0.6+S.brand_awareness*0.15,0.07));
S.detractor_volume=cl(sm(S.detractor_volume,cl((100-S.retention_rate)*0.5+(100-S.perceived_value)*0.2),0.1));
const newRev=S.acquisition_volume*0.3*S.conversion_rate/100;
const retRev=S.revenue*S.retention_rate/100;
S.expansion_revenue=cl(S.retention_rate*0.2+custGrowth*0.3+S.feature_adoption*0.15-10);
const expContrib=S.expansion_revenue*0.15;
const priceMult=pricingLevel/50;
S.revenue=cl(sm(S.revenue,(retRev+newRev+expContrib)*priceMult*0.8,0.15));
// Customer base stock
S.customer_base=cl(sm(S.customer_base,S.customer_base+S.conversion_rate*0.3-((100-S.retention_rate)*S.customer_base/100)*0.5,0.15));
const nrr=S.revenue>0?((retRev+expContrib)/(S.revenue||1))*105:100;
hist.push({month:m+1,revenue:+(S.revenue).toFixed(1),retention_rate:+(S.retention_rate).toFixed(1),nrr:+cl(nrr).toFixed(1),acquisition_volume:+(S.acquisition_volume).toFixed(1),conversion_rate:+(S.conversion_rate).toFixed(1),activation_depth:+(S.activation_depth).toFixed(1),perceived_value:+(S.perceived_value).toFixed(1),value_price_gap:+(S.value_price_gap).toFixed(1),product_quality:+(S.product_quality).toFixed(1),brand_awareness:+(S.brand_awareness).toFixed(1),feature_adoption:+(S.feature_adoption).toFixed(1),switching_costs:+(S.switching_costs).toFixed(1),partnership_ecosystem:+(S.partnership_ecosystem).toFixed(1),social_proof:+(S.social_proof).toFixed(1),advocacy:+(S.advocacy).toFixed(1),detractor_volume:+(S.detractor_volume).toFixed(1),expansion_revenue:+(S.expansion_revenue).toFixed(1),customer_base:+(S.customer_base).toFixed(1),product_complexity:+(S.product_complexity).toFixed(1),channel_saturation:+(S.channel_saturation).toFixed(1)});
}return hist;}
const SCENARIOS={baseline:{pi:50,ci:40,cqi:40,pei:30,pl:50,sq:50,rp:50,ca:50,cg:50},cost_cut:{pi:25,ci:20,cqi:20,pei:15,pl:55,sq:30,rp:50,ca:50,cg:50},invest:{pi:75,ci:35,cqi:55,pei:40,pl:45,sq:55,rp:50,ca:50,cg:50},price_hike:{pi:45,ci:40,cqi:35,pei:30,pl:75,sq:45,rp:50,ca:50,cg:50},balanced:{pi:60,ci:45,cqi:50,pei:45,pl:48,sq:55,rp:50,ca:50,cg:50}};
let simCharts={};
function updSl(){['pi','ci','cqi','pei','pl','sq','rp','ca','cg'].forEach(k=>{const el=document.getElementById('sl-'+k);if(el)document.getElementById('sv-'+k).textContent=el.value;});}
function loadSc(name){const sc=SCENARIOS[name];if(!sc)return;document.querySelectorAll('.sc-btn').forEach(b=>b.classList.toggle('on',b.dataset.sc===name));['pi','ci','cqi','pei','pl','sq','rp','ca','cg'].forEach(k=>{const el=document.getElementById('sl-'+k);if(el){el.value=sc[k];document.getElementById('sv-'+k).textContent=sc[k];}});runSim();}
function sdelta(s,e){const d=e-s;const p=s>0?Math.round(d/s*100):0;const sign=d>0?'+':'';return{text:`${sign}${d.toFixed(1)} (${sign}${p}%)`,cls:d>0.5?'up':(d<-0.5?'down':'flat')};}
function runSim(){
const L={pi:+(document.getElementById('sl-pi')?.value||50),ci:+(document.getElementById('sl-ci')?.value||40),cqi:+(document.getElementById('sl-cqi')?.value||40),pei:+(document.getElementById('sl-pei')?.value||30),pl:+(document.getElementById('sl-pl')?.value||50),sq:+(document.getElementById('sl-sq')?.value||50),rp:+(document.getElementById('sl-rp')?.value||50),ca:+(document.getElementById('sl-ca')?.value||50),cg:+(document.getElementById('sl-cg')?.value||50)};
const hist=simulate(L);if(!hist.length)return;
const labels=hist.map(h=>`M${h.month}`),last=hist[hist.length-1],first=hist[0];
const setM=(id,val,fmt)=>{const el=document.getElementById(id);if(el)el.textContent=fmt?fmt(val):val;};
const setD=(id,s,e)=>{const d=sdelta(s,e);const el=document.getElementById(id);if(el){el.className='sim-metric-delta '+d.cls;el.textContent=d.text;}};
setM('m-rv',last.revenue.toFixed(1));setD('md-rv',first.revenue,last.revenue);
setM('m-nrr',last.nrr.toFixed(1)+'%');setD('md-nrr',first.nrr,last.nrr);
setM('m-pq',last.product_quality.toFixed(1));setD('md-pq',first.product_quality,last.product_quality);
setM('m-baw',last.brand_awareness.toFixed(1));setD('md-baw',first.brand_awareness,last.brand_awareness);
const baseOpts={responsive:true,maintainAspectRatio:false,animation:{duration:500},scales:{x:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#4a5268',font:{size:8}}},y:{grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#4a5268',font:{size:8}},min:0,max:100}},plugins:{legend:{labels:{color:'#94a3b8',font:{size:9},boxWidth:10,padding:6}},tooltip:{backgroundColor:'#111827',borderColor:'#1e293b',borderWidth:1,titleColor:'#f1f5f9',bodyColor:'#94a3b8',bodyFont:{size:10},padding:8,cornerRadius:6}}};
function ds(label,data,color,dash){return{label,data,borderColor:color,backgroundColor:color+'15',fill:false,tension:.4,borderWidth:1.5,pointRadius:0,borderDash:dash||[]};}
Object.values(simCharts).forEach(c=>{try{c.destroy();}catch(e){}});simCharts={};
const gc=document.getElementById('ch-growth');if(gc)simCharts.growth=new Chart(gc,{type:'line',data:{labels,datasets:[ds('Revenue',hist.map(h=>h.revenue),'#f59e0b'),ds('Expansion',hist.map(h=>h.expansion_revenue),'#ec4899'),ds('Acquisition',hist.map(h=>h.acquisition_volume),'#3b82f6',[4,4]),ds('Customer base',hist.map(h=>h.customer_base),'#64748b',[4,4])]},options:{...baseOpts}});
const hc=document.getElementById('ch-health');if(hc)simCharts.health=new Chart(hc,{type:'line',data:{labels,datasets:[ds('Retention',hist.map(h=>h.retention_rate),'#ef4444'),ds('NRR',hist.map(h=>h.nrr),'#f97316'),ds('Perceived value',hist.map(h=>h.perceived_value),'#10b981'),ds('Value-price gap',hist.map(h=>h.value_price_gap),'#f59e0b',[4,4]),ds('Detractors',hist.map(h=>h.detractor_volume),'#a78bfa',[4,4])]},options:{...baseOpts}});
const pc=document.getElementById('ch-pipeline');if(pc)simCharts.pipeline=new Chart(pc,{type:'line',data:{labels,datasets:[ds('Activation depth',hist.map(h=>h.activation_depth),'#06b6d4'),ds('Conversion rate',hist.map(h=>h.conversion_rate),'#10b981'),ds('Acq. quality',hist.map(h=>h.acquisition_quality),'#3b82f6',[4,4]),ds('Social proof',hist.map(h=>h.social_proof),'#d4a017',[4,4])]},options:{...baseOpts}});
const ac=document.getElementById('ch-assets');if(ac)simCharts.assets=new Chart(ac,{type:'line',data:{labels,datasets:[ds('Product quality',hist.map(h=>h.product_quality),'#94a3b8'),ds('Brand awareness',hist.map(h=>h.brand_awareness),'#8b5cf6'),ds('Switching costs',hist.map(h=>h.switching_costs),'#b45309',[4,4]),ds('Partnerships',hist.map(h=>h.partnership_ecosystem),'#7c3aed',[4,4]),ds('Complexity',hist.map(h=>h.product_complexity),'#ef4444',[2,2])]},options:{...baseOpts}});
}

function renderSide(){
const s=document.getElementById('side');

if(selItem.type==='variable'){

out.forEach(e=>{const tn=nMap[e.t];h+=`<div class="sn-edge" onclick="clickSideNode('${tn.id}')"><div class="sn-edge-dot" style="background:${tn.c}"></div><div style="flex:1;min-width:0"><div class="sn-edge-name">${tn.l.replace(/\n/g,' ')}</div><div class="sn-edge-label">${e.n}</div></div><span class="sn-edge-pol ${e.p==='o'?'pol-o':'pol-s'}">(${e.p})</span><div class="sn-edge-dir">→</div></div>`;});h+='</div>';}
const vL=new Set();Ed.forEach(e=>{if(e.f===selItem.id||e.t===selItem.id)e.L.forEach(l=>vL.add(l))});
if(vL.size){h+=`<div class="sn-sec"><div class="sn-sec-title">Loops</div>`;
[...vL].forEach(lid=>{const l=loops.find(x=>x.id===lid);if(l)h+=`<div class="cl" onclick="goLayer(0);setTimeout(()=>filterLoop('${lid}'),100)"><span class="cl-layer">CLD</span><span class="dot" style="background:${l.c};width:6px;height:6px"></span><span class="cl-name" style="color:${l.c}">${l.n}</span></div>`;});h+='</div>';}
const relTeams=orgTeams.filter(t=>t.loops.some(lid=>[...vL].includes(lid)));
if(relTeams.length){h+=`<div class="sn-sec"><div class="sn-sec-title">Teams</div>`;relTeams.forEach(t=>{h+=`<div class="cl" onclick="goLayer(3);selectItem('org','${t.id}')"><span class="cl-layer">Org</span><span class="dot" style="background:${t.c};width:6px;height:6px"></span><span class="cl-name">${t.name}</span></div>`;});h+='</div>';}
// Show active loops below variable when both are active
if(activeLoops.size){h+=`<div class="sn-sec"><div class="sn-sec-title">Active loops (${activeLoops.size})</div>`;
[...activeLoops].forEach(lid=>{const l=loops.find(x=>x.id===lid);if(!l)return;
h+=`<div style="margin-bottom:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.02);border-left:3px solid ${l.c}"><div style="font-size:11px;font-weight:700;color:${l.c};margin-bottom:2px">${l.n}</div><div style="font-size:10px;color:${C.textDim};line-height:1.5">${l.d}</div></div>`;});
h+='</div>';}
}
else if(selItem.type==='loop'){
const aLoops=[...activeLoops];
aLoops.forEach(lid=>{
const l=loops.find(x=>x.id===lid);if(!l)return;
const tp=l.g===2?'Balancing':l.g===3?'External':'Reinforcing';

h+=`<span class="chain-v" style="background:${vc.c}18;color:${vc.c};border:1px solid ${vc.c}30">${v.l.replace(/\n/g,' ')}</span>`;
if(i<l.ch.length-1){const nv=l.ch[i+1],edge=Ed.find(e=>e.f===vid&&e.t===nv),pol=edge?edge.p:'?';

}
else if(selItem.type==='perspective'){

}
else if(selItem.type==='matrix'){
const[sI,stI]=selItem.id.split('-'),seg=segments.find(x=>x.id===sI),str=strategies.find(x=>x.id===stI),cell=matrix[selItem.id];

}
else if(selItem.type==='org'){

}
s.innerHTML=h;
}

if(nd){pinned=nd;selItem={type:'variable',id};d3Refs.applyState();renderSide();}
}
