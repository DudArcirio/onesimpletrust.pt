<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>noise.os — Digital Readiness Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--bg:#0a0e1a;--bgCard:#111827;--bgAlt:#1a2234;--bgHov:#1e293b;--accent:#3b82f6;--accentL:#60a5fa;--success:#10b981;--successL:#34d399;--warn:#f59e0b;--warnL:#fbbf24;--danger:#ef4444;--dangerL:#f87171;--purple:#8b5cf6;--purpleL:#a78bfa;--pink:#ec4899;--cyan:#06b6d4;--text:#f1f5f9;--textDim:#94a3b8;--textMut:#64748b;--border:#1e293b;--gold:#d4a017;--sans:'Inter',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--text);background:var(--bg);overflow-x:hidden;font-weight:400}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.top-bar{padding:10px 16px;background:linear-gradient(135deg,var(--bgCard),var(--bgAlt));border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.logo{font-size:14px;font-weight:800;letter-spacing:-.3px}.logo span{color:var(--textMut);font-weight:400;font-size:12px}
.logo-mark{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);margin-right:6px;vertical-align:middle;box-shadow:0 0 10px rgba(212,160,23,.5)}
.lt-bar{background:var(--bgCard);border-bottom:1px solid var(--border);padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.lt{padding:10px 14px;border:none;cursor:pointer;background:transparent;border-bottom:2px solid transparent;color:var(--textMut);font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap;font-family:var(--sans);text-transform:uppercase;letter-spacing:.4px}
.lt:hover{color:var(--textDim)}.lt.on{border-bottom-color:var(--accent);color:var(--accent)}
.lt-k{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;background:rgba(59,130,246,.12);color:var(--accentL);font-size:10px;font-weight:700}
.wrap{display:flex;height:calc(100vh - 88px)}
.content{flex:1;overflow-y:auto;padding:20px 22px}
.side{width:360px;flex-shrink:0;border-left:1px solid var(--border);overflow-y:auto;background:rgba(12,16,30,.97);backdrop-filter:blur(20px)}
.side-inner{padding:22px}
.side-empty{font-size:12px;color:var(--textMut);line-height:1.7;padding:8px 0}
.sec{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--textMut);margin:14px 0 8px;font-weight:700}.sec:first-child{margin-top:0}
h2{font-size:17px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
.desc{font-size:12.5px;color:var(--textDim);line-height:1.65;margin-bottom:14px;max-width:780px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:8px;font-weight:700;letter-spacing:.3px;margin:1px;border:1px solid;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:10px;font-weight:600;border:1px solid;background:rgba(255,255,255,.02)}

/* ---------- Portfolio ---------- */
.pf-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.pf-kpi{background:var(--bgCard);border:1px solid var(--border);border-radius:12px;padding:14px}
.pf-kpi-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--textMut);text-transform:uppercase;margin-bottom:4px}
.pf-kpi-val{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.pf-kpi-sub{font-size:10.5px;color:var(--textDim);margin-top:3px;line-height:1.4}
.pf-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.pf-table{width:100%;background:var(--bgCard);border:1px solid var(--border);border-radius:12px;overflow:hidden;border-collapse:separate;border-spacing:0}
.pf-table th{background:var(--bgAlt);font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--textMut);text-transform:uppercase;padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
.pf-table th.num{text-align:right}
.pf-table td{padding:11px 12px;font-size:12px;border-bottom:1px solid rgba(30,41,59,.45);vertical-align:middle}
.pf-table tr:last-child td{border-bottom:none}
.pf-table tr:hover td{background:rgba(255,255,255,.015);cursor:pointer}
.pf-table tr.on td{background:rgba(59,130,246,.08)}
.co-name{font-weight:700;letter-spacing:-.2px}
.co-sec{font-size:10px;color:var(--textMut);margin-top:1px}
.score-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.score-bar{width:120px;height:6px;border-radius:3px;background:var(--bgAlt);overflow:hidden;position:relative}
.score-bar-fill{height:100%;border-radius:3px}
.score-num{font-size:13px;font-weight:800;letter-spacing:-.2px;min-width:28px;text-align:right}
.heat-row{display:flex;gap:3px}
.heat-cell{width:14px;height:14px;border-radius:3px;cursor:help}
.status-crit{background:rgba(239,68,68,.12);color:var(--danger);border-color:rgba(239,68,68,.25)}
.status-risk{background:rgba(245,158,11,.12);color:var(--warn);border-color:rgba(245,158,11,.25)}
.status-ready{background:rgba(6,182,212,.12);color:var(--cyan);border-color:rgba(6,182,212,.25)}
.status-adv{background:rgba(16,185,129,.12);color:var(--success);border-color:rgba(16,185,129,.25)}

/* ---------- Diagnóstico ---------- */
.dg-wrap{display:grid;grid-template-columns:1fr 380px;gap:14px;margin-bottom:16px}
.dg-card{background:var(--bgCard);border:1px solid var(--border);border-radius:14px;padding:18px}
.dg-co-line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.dg-co-title{font-size:22px;font-weight:800;letter-spacing:-.4px}
.dg-co-sub{font-size:11px;color:var(--textMut);margin-top:3px}
.dg-big-score{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1}
.dg-big-score-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--textMut);text-transform:uppercase;margin-top:3px}
.dg-radar{width:100%;height:330px}
.dg-dims{display:flex;flex-direction:column;gap:6px}
.dg-dim{padding:10px 12px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid transparent;cursor:pointer;transition:all .15s}
.dg-dim:hover{background:rgba(255,255,255,.04)}
.dg-dim.on{border-color:var(--accent);background:rgba(59,130,246,.06)}
.dg-dim-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dg-dim-name{font-size:12px;font-weight:600;color:var(--textDim)}
.dg-dim-score{font-size:12px;font-weight:800;letter-spacing:-.2px}
.dg-dim-bar{width:100%;height:4px;border-radius:2px;background:var(--bgAlt);overflow:hidden;margin-top:5px}
.dg-dim-bar-fill{height:100%;border-radius:2px}
.dg-select{background:var(--bgAlt);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text);font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;min-width:240px}
.dg-narrative{background:var(--bg);border-radius:10px;border:1px solid var(--border);padding:14px 16px;margin-top:12px;font-size:12.5px;color:var(--textDim);line-height:1.7;border-left:3px solid var(--gold)}
.dg-narrative em{color:var(--gold);font-style:italic;font-weight:500}

/* ---------- Alvos ---------- */
.tg-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tg-fbtn{padding:5px 12px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--textMut);font-size:11px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.tg-fbtn:hover{background:rgba(255,255,255,.05)}
.tg-fbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tg-grid{display:grid;grid-template-columns:1fr;gap:10px}
.tg-card{background:var(--bgCard);border:1px solid var(--border);border-radius:12px;padding:16px 18px;cursor:pointer;transition:all .15s}
.tg-card:hover{border-color:var(--textMut)}
.tg-card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tg-head{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:flex-start;margin-bottom:10px}
.tg-title{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.35}
.tg-company{font-size:10.5px;color:var(--textMut);margin-top:3px;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
.tg-qw{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;border:1px solid}
.tg-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 10px}
.tg-meta-item{display:flex;flex-direction:column}
.tg-meta-lbl{font-size:9px;color:var(--textMut);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.tg-meta-val{font-size:13px;font-weight:700;margin-top:2px;letter-spacing:-.2px}
.tg-why{font-size:12px;color:var(--textDim);line-height:1.6;padding:10px 12px;background:var(--bg);border-radius:8px;border:1px solid var(--border);margin-top:8px}
.tg-why b{color:var(--text);font-weight:600}
.tg-funds{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.tg-impact-row{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.tg-impact-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--textDim)}
.tg-impact-val{font-weight:800;color:var(--success);font-size:12.5px;letter-spacing:-.2px}

/* ---------- Fundos EU ---------- */
.fd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px}
.fd-card{background:var(--bgCard);border:1px solid var(--border);border-radius:14px;padding:18px;border-top:3px solid var(--accent);cursor:pointer;transition:border-color .15s}
.fd-card:hover{border-color:var(--textMut)}
.fd-card.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.fd-head{font-size:10px;font-weight:700;color:var(--accentL);text-transform:uppercase;letter-spacing:.8px}
.fd-title{font-size:15px;font-weight:700;margin-top:4px;letter-spacing:-.2px;line-height:1.35}
.fd-body{font-size:12px;color:var(--textDim);line-height:1.6;margin-top:8px}
.fd-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.fd-meta-item{display:flex;flex-direction:column}
.fd-meta-lbl{font-size:9px;color:var(--textMut);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.fd-meta-val{font-size:12px;font-weight:600;margin-top:3px;color:var(--text)}
.fd-coverage{font-size:10.5px;color:var(--textMut);margin-top:10px;font-style:italic}

/* ---------- Side panel ---------- */
.sn-group{display:inline-flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:1.2px;font-weight:700;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,.06);margin-bottom:12px}
.sn-title{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px;line-height:1.3}
.sn-detail{font-size:12.5px;color:var(--textDim);line-height:1.65;margin-bottom:6px}
.sn-meta{display:flex;gap:14px;margin-top:12px;padding-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.sn-meta-item{display:flex;flex-direction:column;gap:2px}
.sn-meta-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#4a5268;font-weight:700}
.sn-meta-val{font-size:13px;font-weight:700;color:var(--textDim);letter-spacing:-.2px}
.sn-sec{padding:16px 0;border-bottom:1px solid rgba(30,41,59,.45)}
.sn-sec:last-child{border:none}
.sn-sec-title{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#4a5268;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sn-sec-count{background:rgba(255,255,255,.06);padding:1px 7px;border-radius:8px;font-size:10px;color:#6a7488;font-weight:700}
.sn-edge{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:4px;border-radius:8px;background:rgba(255,255,255,.02);cursor:pointer;transition:background .15s}
.sn-edge:hover{background:rgba(255,255,255,.06)}
.sn-edge-dot{width:8px;height:8px;border-radius:4px;flex-shrink:0}
.sn-edge-name{font-size:12px;font-weight:600;color:#d0d8e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn-edge-label{font-size:10px;color:#5a6478;margin-top:1px}
.sn-edge-val{font-size:11px;font-weight:800;color:var(--textDim);letter-spacing:-.2px}

/* ---------- Knowledge Graph ---------- */
.kg-wrap{display:flex;flex-direction:column;gap:12px}
.kg-toolbar{background:var(--bgCard);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.kg-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--textDim)}
.kg-legend-item{display:inline-flex;align-items:center;gap:6px}
.kg-legend-shape{width:14px;height:14px;display:inline-block;flex-shrink:0}
.kg-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-left:auto}
.kg-fbtn{padding:4px 10px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,.02);color:var(--textMut);font-size:10.5px;font-weight:600;cursor:pointer;font-family:var(--sans);letter-spacing:.3px;text-transform:uppercase}
.kg-fbtn:hover{background:rgba(255,255,255,.05)}
.kg-fbtn.on{color:var(--text);border-color:var(--textMut);background:rgba(255,255,255,.06)}
.kg-canvas{background:var(--bgCard);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:relative;height:calc(100vh - 260px);min-height:560px}
.kg-svg{width:100%;height:100%;display:block;cursor:grab}
.kg-svg:active{cursor:grabbing}
.kg-hint{position:absolute;top:10px;left:14px;font-size:10px;color:var(--textMut);font-weight:600;letter-spacing:.5px;text-transform:uppercase;background:rgba(10,14,26,.75);backdrop-filter:blur(6px);padding:5px 10px;border-radius:999px;border:1px solid var(--border)}
.kg-node-lbl{font-family:var(--sans);font-size:10px;font-weight:600;fill:var(--textDim);pointer-events:none;user-select:none}
.kg-node-lbl.big{font-size:11px;font-weight:700;fill:var(--text)}
.kg-meta-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.kg-meta-cell{background:var(--bgCard);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.kg-meta-cell-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--textMut);text-transform:uppercase}
.kg-meta-cell-val{font-size:18px;font-weight:800;letter-spacing:-.3px;margin-top:3px}

/* ---------- Investor view ---------- */
.iv-kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.iv-kpi{background:var(--bgCard);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative;overflow:hidden}
.iv-kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent)}
.iv-kpi.ok::before{background:var(--success)}
.iv-kpi.warn::before{background:var(--warn)}
.iv-kpi.gold::before{background:var(--gold)}
.iv-kpi-lbl{font-size:9px;font-weight:700;letter-spacing:.8px;color:var(--textMut);text-transform:uppercase;margin-bottom:4px}
.iv-kpi-val{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.iv-kpi-sub{font-size:10.5px;color:var(--textDim);margin-top:3px;line-height:1.4}
.iv-grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-bottom:16px}
.iv-panel{background:var(--bgCard);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.iv-panel-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;gap:10px}
.iv-panel-title{font-size:13px;font-weight:800;letter-spacing:-.2px}
.iv-panel-sub{font-size:10.5px;color:var(--textMut);line-height:1.5;max-width:520px}
.iv-bar-row{display:grid;grid-template-columns:200px 1fr 70px 60px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(30,41,59,.4);cursor:pointer;transition:background .15s}
.iv-bar-row:last-child{border-bottom:none}
.iv-bar-row:hover{background:rgba(255,255,255,.02)}
.iv-bar-lbl{font-size:11.5px;font-weight:600;color:var(--textDim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv-bar-co{font-size:9.5px;color:var(--textMut);margin-top:1px;text-transform:uppercase;letter-spacing:.4px}
.iv-bar-track{height:8px;border-radius:4px;background:rgba(255,255,255,.03);overflow:hidden;position:relative}
.iv-bar-fill{height:100%;border-radius:4px;transition:width .4s}
.iv-bar-num{font-size:11.5px;font-weight:800;text-align:right;letter-spacing:-.2px}
.iv-bar-tag{font-size:9px;font-weight:700;text-align:right;color:var(--textMut);text-transform:uppercase;letter-spacing:.4px}
.iv-heat{display:grid;gap:2px;margin-top:8px}
.iv-heat-head,.iv-heat-row{display:grid;grid-template-columns:160px repeat(8,1fr);gap:2px;align-items:center}
.iv-heat-cell{height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;cursor:help}
.iv-heat-lbl-row{font-size:11px;font-weight:700;color:var(--textDim);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iv-heat-lbl-col{font-size:9px;font-weight:700;color:var(--textMut);text-transform:uppercase;letter-spacing:.3px;text-align:center;padding:3px 0}
.iv-cascade{display:flex;align-items:flex-end;gap:3px;height:200px;padding:20px 0 12px;border-bottom:1px solid var(--border)}
.iv-cascade-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;position:relative;min-width:30px}
.iv-cascade-seg{border-radius:3px 3px 0 0;transition:all .3s}
.iv-cascade-lbl{font-size:10px;color:var(--textDim);text-align:center;margin-top:6px;line-height:1.3;white-space:nowrap}
.iv-cascade-val{font-size:11px;font-weight:800;text-align:center;margin-top:1px;letter-spacing:-.2px}
.iv-dimcov{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.iv-dimcov-cell{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.iv-dimcov-name{font-size:10.5px;font-weight:700;letter-spacing:-.1px;line-height:1.2}
.iv-dimcov-sub{font-size:9.5px;color:var(--textMut);margin-top:3px;letter-spacing:.3px;text-transform:uppercase}
.iv-dimcov-num{font-size:15px;font-weight:800;margin-top:4px;letter-spacing:-.3px}
.iv-target-tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:11.5px}
.iv-target-tbl th{background:var(--bgAlt);font-size:9px;font-weight:700;letter-spacing:.6px;color:var(--textMut);text-transform:uppercase;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.iv-target-tbl th.num{text-align:right}
.iv-target-tbl td{padding:8px 10px;border-bottom:1px solid rgba(30,41,59,.45);vertical-align:middle;cursor:pointer}
.iv-target-tbl td.num{text-align:right;font-weight:700;letter-spacing:-.2px}
.iv-target-tbl tr:last-child td{border-bottom:none}
.iv-target-tbl tr:hover td{background:rgba(255,255,255,.02)}
.iv-target-tbl tr.on td{background:rgba(59,130,246,.08)}

@media(max-width:1100px){.pf-kpis{grid-template-columns:repeat(2,1fr)}.dg-wrap{grid-template-columns:1fr}.fd-grid{grid-template-columns:1fr}.wrap{flex-direction:column;height:auto}.side{width:100%;border-left:none;border-top:1px solid var(--border)}.kg-meta-grid{grid-template-columns:repeat(2,1fr)}.iv-kpis{grid-template-columns:repeat(2,1fr)}.iv-grid2{grid-template-columns:1fr}.iv-dimcov{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

/* Infer impact links from target impact strings */
function targetImpacts(t){
 const out=[];
 const rev=(t.impact.rev||'').toLowerCase();
 const mgn=(t.impact.margin||'').toLowerCase();
 const eff=(t.impact.eff||'').toLowerCase();
 if(/\+/.test(rev)||/novos contratos|receita|expansion|lt[vl]|ocupação|wine|contratos/.test(rev))out.push('I-REV');
 if(/risco|evita|fines/.test(rev)||/risco|evita|fines/.test(mgn))out.push('I-RSK');
 if(/\+\d|pp|platform|margins/.test(mgn))out.push('I-MGN');
 if(/ciclo|tempo|−|-\d|tickets|churn|no-show|fecho|alcance|nps|seguro|baseline|base/.test(eff))out.push('I-EFF');
 return [...new Set(out)];
}

function drawRadar(co){
 const svg=document.getElementById('dg-radar');if(!svg)return;
 const cx=260,cy=170,R=130;
 const N=DIMS.length;
 let s='';
 /* grid rings */
 for(let r=1;r<=5;r++){
  const rr=R*r/5;
  let pts='';
  for(let i=0;i<N;i++){
   const a=-Math.PI/2+i*2*Math.PI/N;
   pts+=(cx+rr*Math.cos(a))+','+(cy+rr*Math.sin(a))+' ';
  }
  s+=`<polygon points="${pts}" fill="none" stroke="rgba(148,163,184,.08)" stroke-width="1"/>`;
  if(r===5)s+=`<polygon points="${pts}" fill="none" stroke="rgba(148,163,184,.18)" stroke-width="1"/>`;
 }
 /* axis lines + labels */
 for(let i=0;i<N;i++){
  const a=-Math.PI/2+i*2*Math.PI/N;
  const x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
  s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(148,163,184,.08)" stroke-width="1"/>`;
  const lx=cx+(R+22)*Math.cos(a),ly=cy+(R+22)*Math.sin(a);
  const d=DIMS[i];
  s+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="600" fill="${d.c}" font-family="Inter">${d.name.replace(' & ',' / ').split(' ').slice(0,2).join(' ')}</text>`;
  s+=`<text x="${lx}" y="${ly+11}" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="700" fill="${scoreColor(co.s[d.id])}" font-family="Inter">${co.s[d.id]}</text>`;
 }
 /* data polygon */
 let dpts='';
 for(let i=0;i<N;i++){
  const a=-Math.PI/2+i*2*Math.PI/N;
  const v=co.s[DIMS[i].id]/100;
  dpts+=(cx+R*v*Math.cos(a))+','+(cy+R*v*Math.sin(a))+' ';
 }
 s+=`<polygon points="${dpts}" fill="${scoreColor(co.score)}" fill-opacity=".18" stroke="${scoreColor(co.score)}" stroke-width="1.8"/>`;
 for(let i=0;i<N;i++){
  const a=-Math.PI/2+i*2*Math.PI/N;
  const v=co.s[DIMS[i].id]/100;
  const x=cx+R*v*Math.cos(a),y=cy+R*v*Math.sin(a);
  s+=`<circle cx="${x}" cy="${y}" r="3.5" fill="${DIMS[i].c}" stroke="var(--bg)" stroke-width="1.5"/>`;
 }
 svg.innerHTML=s;
}

function renderInvestor(c){

 });

 });
 h+='</div>';

 /* Cost distribution by company — treemap-like stacked bars */

 h+='<div class="iv-panel-head"><div><div class="iv-panel-title">Custo por investida</div><div class="iv-panel-sub">TCO 3 anos por empresa, com fatia coberta por fundos EU/PT destacada.</div></div></div>';

 });

 /* Compute dim x fund matrix: total capex*coverage attributed */

 DIMS.forEach(d=>{mtx[d.id]={};FUNDS.forEach(f=>{mtx[d.id][f.id]=0})});
 TARGETS.forEach(t=>{

 h+='<div class="iv-heat">';

 DIMS.forEach(d=>{

/* Build nodes & edges from the conceptual model */
function buildKG(){
 const nodes=[];
 const edges=[];
 /* Companies */
 COMPANIES.forEach(c=>nodes.push({id:'co:'+c.id,type:'co',label:c.name,data:c,r:18,c:STATUS[c.status].c}));
 /* Dimensions */
 DIMS.forEach(d=>nodes.push({id:'dim:'+d.id,type:'dim',label:d.name,data:d,r:14,c:d.c}));
 /* Targets */
 TARGETS.forEach(t=>nodes.push({id:'tg:'+t.id,type:'tg',label:t.title.length>38?t.title.slice(0,35)+'…':t.title,data:t,r:11,c:t.quickwin?'var(--success)':'var(--warn)'}));
 /* Funds */
 FUNDS.forEach(f=>nodes.push({id:'fd:'+f.id,type:'fd',label:f.short,data:f,r:13,c:'var(--accentL)'}));
 /* Impacts */
 IMPACTS.forEach(i=>nodes.push({id:'im:'+i.id,type:'im',label:i.name,data:i,r:15,c:i.c}));
 /* Edges: Target -> Dimension (addresses) */
 TARGETS.forEach(t=>edges.push({s:'tg:'+t.id,t:'dim:'+t.dim,kind:'addresses',w:1.6}));
 /* Edges: Target -> Company (belongs to) */
 TARGETS.forEach(t=>edges.push({s:'tg:'+t.id,t:'co:'+t.co,kind:'belongs',w:1.6}));
 /* Edges: Target -> Fund (financed by) */
 TARGETS.forEach(t=>t.funds.forEach(fid=>edges.push({s:'tg:'+t.id,t:'fd:'+fid,kind:'funded',w:1.1})));
 /* Edges: Target -> Impact (generates) */
 TARGETS.forEach(t=>targetImpacts(t).forEach(iid=>edges.push({s:'tg:'+t.id,t:'im:'+iid,kind:'impacts',w:1.2})));
 /* Edges: Company -> Dimension (top 2 gaps per company — "where value is stuck") */
 COMPANIES.forEach(c=>{
  const sorted=DIMS.map(d=>({d,v:c.s[d.id]})).sort((a,b)=>a.v-b.v).slice(0,2);
  sorted.forEach(({d,v})=>edges.push({s:'co:'+c.id,t:'dim:'+d.id,kind:'gap',w:0.6,meta:v}));
 });
 return {nodes,edges};
}

/* Position cache — preserves node positions across filter toggles */
let kgPositions={};
let kgD3Refs=null;
/* Layout mode: 'force' (physics) | 'layers' (swimlanes by type) */
let kgLayout='force';
/* Sizing mode: 'uniform' (fixed r per type) | 'attr' (scaled by node attribute) */
let kgSizing='uniform';

/* Compute node radius — either uniform defaults or scaled by a domain attribute */
function applyNodeSizing(nodes){
 const defaults={co:18,dim:14,tg:11,fd:13,im:15};
 if(kgSizing==='uniform'){nodes.forEach(n=>n.r=defaults[n.type]);return;}
 /* Attribute extractors per type */
 function attrOf(n){
  if(n.type==='co'){const m=n.data.rev&&n.data.rev.match(/[\d.]+/);return m?parseFloat(m[0]):0;}
  if(n.type==='dim'){
   /* Size = aggregate gap — lower portfolio avg score means bigger node (more systemic gap) */
   const vs=COMPANIES.map(c=>c.s[n.data.id]);
   const avg=vs.reduce((a,b)=>a+b,0)/vs.length;
   return 100-avg;
  }
  if(n.type==='tg'){return n.data.value_3y_k||n.data.capex_k||0;}
  if(n.type==='fd'){const m=n.data.max&&n.data.max.match(/[\d.]+/);return m?parseFloat(m[0]):0;}
  if(n.type==='im'){let ct=0;TARGETS.forEach(t=>{if(targetImpacts(t).indexOf(n.data.id)>=0)ct++;});return ct;}
  return 1;
 }
 const ranges={co:[11,24],dim:[9,20],tg:[7,18],fd:[9,20],im:[10,22]};
 const perType={};
 nodes.forEach(n=>{
  if(!perType[n.type])perType[n.type]={vals:{},min:Infinity,max:-Infinity};
  const v=attrOf(n);
  perType[n.type].vals[n.id]=v;
  if(v<perType[n.type].min)perType[n.type].min=v;
  if(v>perType[n.type].max)perType[n.type].max=v;
 });
 nodes.forEach(n=>{
  const pt=perType[n.type];
  const [rMin,rMax]=ranges[n.type]||[10,18];
  const v=pt.vals[n.id];
  const norm=pt.max>pt.min?(v-pt.min)/(pt.max-pt.min):0.5;
  n.r=rMin+norm*(rMax-rMin);
 });
}

/* Build D3 force-directed graph with drag, zoom, hover, pin */
function buildD3KG(){
 const svgEl=document.getElementById('kg-svg');
 if(!svgEl||typeof d3==='undefined')return;
 const canvas=svgEl.parentElement;
 const W=Math.max(canvas.clientWidth||1100,800);
 const H=Math.max(canvas.clientHeight||560,500);

 const svg=d3.select(svgEl);
 svg.selectAll('*').remove();
 svg.attr('viewBox',`0 0 ${W} ${H}`);

 /* Build data */
 const {nodes:allNodes,edges:allEdges}=buildKG();
 const visible=new Set(allNodes.filter(n=>kgFilters[n.type]).map(n=>n.id));
 const nodes=allNodes.filter(n=>visible.has(n.id)).map(n=>{
  const o={...n};
  /* Seed positions: from cache if exists, otherwise by type-radial */
  if(kgPositions[n.id]){o.x=kgPositions[n.id].x;o.y=kgPositions[n.id].y}
  else{
   const typeAngles={co:-Math.PI*0.75,dim:-Math.PI*0.25,tg:0,fd:Math.PI*0.25,im:Math.PI*0.75};
   const typeRadius={co:0.78,dim:0.42,tg:0.12,fd:0.58,im:0.82};
   const peers=allNodes.filter(x=>x.type===n.type);
   const idx=peers.indexOf(n);
   const spread=peers.length>1?(idx/(peers.length-1)-0.5)*Math.PI*0.55:0;
   const ang=typeAngles[n.type]+spread;
   const R=Math.min(W,H)*0.38*typeRadius[n.type];
   let hash=0;for(let i=0;i<n.id.length;i++){hash=((hash<<5)-hash)+n.id.charCodeAt(i);hash|=0}
   const jitter=((hash%1000)/1000-0.5)*20;
   o.x=W/2+Math.cos(ang)*R+jitter;
   o.y=H/2+Math.sin(ang)*R+((hash>>8)%1000/1000-0.5)*20;
  }
  return o;
 });
 const nodeMap={};nodes.forEach(n=>nodeMap[n.id]=n);
 const edges=allEdges.filter(e=>nodeMap[e.s]&&nodeMap[e.t]).map(e=>({source:e.s,target:e.t,kind:e.kind,w:e.w}));

 /* Apply node sizing (uniform vs. attribute-scaled) */
 applyNodeSizing(nodes);

 /* Layered layout — position nodes in horizontal swimlanes by type (Empresa → Dimensão → Alvo → Fundo → Impacto) */
 if(kgLayout==='layers'){
  const lanes=[['co',0.11],['dim',0.30],['tg',0.52],['fd',0.74],['im',0.92]];
  lanes.forEach(([type,yFrac])=>{
   const peers=nodes.filter(n=>n.type===type);
   peers.forEach((n,i)=>{
    const x=W*((i+1)/(peers.length+1));
    const y=H*yFrac;
    n.x=x;n.y=y;n.fx=x;n.fy=y;
   });
  });
 }else{
  /* Clear pins from a previous 'layers' session so force mode can flow again */
  nodes.forEach(n=>{if(!kgPositions[n.id]){n.fx=null;n.fy=null;}});
 }

 /* Defs: glow + arrow markers per edge kind */
 const defs=svg.append('defs');
 const glow=defs.append('filter').attr('id','kg-glow').attr('x','-50%').attr('y','-50%').attr('width','200%').attr('height','200%');
 glow.append('feGaussianBlur').attr('stdDeviation','2.5').attr('result','blur');
 const mg=glow.append('feMerge');mg.append('feMergeNode').attr('in','blur');mg.append('feMergeNode').attr('in','SourceGraphic');

 const edgeStyle={
  addresses:{c:'#8b5cf6',op:0.55},
  belongs:{c:'#94a3b8',op:0.32},
  funded:{c:'#3b82f6',op:0.55},
  impacts:{c:'#10b981',op:0.58},
  gap:{c:'#ef4444',op:0.42}
 };
 Object.keys(edgeStyle).forEach(k=>{
  defs.append('marker').attr('id','kg-arr-'+k).attr('viewBox','0 -4 8 8').attr('refX',6).attr('refY',0).attr('markerWidth',5).attr('markerHeight',5).attr('orient','auto')
   .append('path').attr('d','M0,-3.2L8,0L0,3.2').attr('fill',edgeStyle[k].c).attr('fill-opacity',0.8);
 });

 /* Root g for zoom */
 const root=svg.append('g');
 const zoom=d3.zoom().scaleExtent([.3,3]).on('zoom',ev=>root.attr('transform',ev.transform));
 svg.call(zoom);

 /* Simulation */
 /* Identify isolated nodes (no edges) — they need stronger centering to avoid drift */
 const degMap={};nodes.forEach(n=>degMap[n.id]=0);
 edges.forEach(e=>{
  const sid=typeof e.source==='string'?e.source:e.source.id;
  const tid=typeof e.target==='string'?e.target:e.target.id;
  degMap[sid]=(degMap[sid]||0)+1;degMap[tid]=(degMap[tid]||0)+1;
 });
 const sim=d3.forceSimulation(nodes)
  .force('link',d3.forceLink(edges).id(d=>d.id).distance(d=>{
   if(d.kind==='belongs')return 90;
   if(d.kind==='addresses')return 85;
   if(d.kind==='funded')return 110;
   if(d.kind==='impacts')return 120;
   if(d.kind==='gap')return 100;
   return 100;
  }).strength(d=>d.kind==='gap'?0.25:0.55))
  .force('charge',d3.forceManyBody().strength(-340).distanceMax(Math.min(W,H)*0.55))
  .force('center',d3.forceCenter(W/2,H/2).strength(0.06))
  .force('x',d3.forceX(W/2).strength(d=>degMap[d.id]===0?0.18:0.04))
  .force('y',d3.forceY(H/2).strength(d=>degMap[d.id]===0?0.18:0.05))
  .force('collision',d3.forceCollide().radius(d=>d.r+12));

 /* Edge pair offsets for bezier (slight curve) */
 const edgePairs={};
 edges.forEach((e,i)=>{
  const a=typeof e.source==='string'?e.source:e.source.id;
  const b=typeof e.target==='string'?e.target:e.target.id;
  const key=[a,b].sort().join('|');
  if(!edgePairs[key])edgePairs[key]=[];
  edgePairs[key].push(i);
 });
 edges.forEach((e,i)=>{
  const a=typeof e.source==='string'?e.source:e.source.id;
  const b=typeof e.target==='string'?e.target:e.target.id;
  const key=[a,b].sort().join('|');
  const grp=edgePairs[key];
  const idx=grp.indexOf(i);
  const cnt=grp.length;
  if(cnt===1)e._curve=0.10;
  else e._curve=0.16*(idx-(cnt-1)/2)+(a<b?0.06:-0.06);
 });

 function bezier(d){
  const sx=d.source.x,sy=d.source.y,tx=d.target.x,ty=d.target.y;
  const dx=tx-sx,dy=ty-sy,dist=Math.sqrt(dx*dx+dy*dy)||1;
  const nx=-dy/dist,ny=dx/dist;
  const off=dist*d._curve;
  const cx=(sx+tx)/2+nx*off,cy=(sy+ty)/2+ny*off;
  const tdx=tx-cx,tdy=ty-cy,tdist=Math.sqrt(tdx*tdx+tdy*tdy)||1;
  const pad=(d.target.r||12)+6;
  const ex=tx-(tdx/tdist)*pad,ey=ty-(tdy/tdist)*pad;
  const sdx=sx-cx,sdy=sy-cy,sdist=Math.sqrt(sdx*sdx+sdy*sdy)||1;
  const spad=(d.source.r||12)+3;
  const ssx=sx-(sdx/sdist)*spad,ssy=sy-(sdy/sdist)*spad;
  const mx=0.25*ssx+0.5*cx+0.25*ex,my=0.25*ssy+0.5*cy+0.25*ey;
  return {sx:ssx,sy:ssy,cx,cy,ex,ey,mx,my};
 }

 /* Links as paths */
 const linkG=root.append('g').attr('class','kg-links');
 const link=linkG.selectAll('path').data(edges).join('path')
  .attr('fill','none')
  .attr('stroke',d=>edgeStyle[d.kind].c)
  .attr('stroke-opacity',d=>edgeStyle[d.kind].op)
  .attr('stroke-width',d=>d.kind==='gap'?1.0:1.3)
  .attr('stroke-dasharray',d=>d.kind==='gap'?'4,4':null)
  .attr('marker-end',d=>`url(#kg-arr-${d.kind})`);

 /* Edge labels (shown on focus) */
 const edgeKindLabel={addresses:'endereça',belongs:'pertence a',funded:'financiado por',impacts:'gera',gap:'gap crítico'};
 const elG=root.append('g').attr('class','kg-edge-labels');
 const el=elG.selectAll('g').data(edges).join('g').style('opacity',0).style('pointer-events','none');
 el.append('rect').attr('fill','rgba(10,14,26,.92)').attr('stroke','var(--border)').attr('stroke-width',0.5).attr('rx',3);
 el.append('text').attr('text-anchor','middle').attr('dy',3).attr('font-size',9).attr('font-weight',600).attr('font-family','Inter').attr('fill',d=>edgeStyle[d.kind].c).text(d=>edgeKindLabel[d.kind]);

 /* Nodes — different shape per type */
 const nodeG=root.append('g').attr('class','kg-nodes');
 const node=nodeG.selectAll('g').data(nodes).join('g').attr('class','kg-node').style('cursor','pointer');

 node.each(function(d){
  const g=d3.select(this);
  const col=d.c;
  /* Outer glow shape */
  if(d.type==='co'){
   g.append('circle').attr('class','kg-shape').attr('r',d.r).attr('fill',col).attr('fill-opacity',0.18).attr('stroke',col).attr('stroke-width',1.8).attr('stroke-opacity',0.75).style('filter','url(#kg-glow)');
   g.append('circle').attr('class','kg-dot').attr('r',d.r*0.35).attr('fill',col).attr('fill-opacity',0.7);
  }else if(d.type==='dim'){
   /* Triangle (equilateral, pointing up) — distinguishes dimension from company circle */
   const s=d.r*1.25;
   const pts=`0,${(-s).toFixed(1)} ${(s*0.866).toFixed(1)},${(s*0.5).toFixed(1)} ${(-s*0.866).toFixed(1)},${(s*0.5).toFixed(1)}`;
   g.append('polygon').attr('class','kg-shape').attr('points',pts).attr('stroke-linejoin','round').attr('fill',col).attr('fill-opacity',0.28).attr('stroke',col).attr('stroke-width',1.8).attr('stroke-opacity',0.8).style('filter','url(#kg-glow)');
   g.append('circle').attr('class','kg-dot').attr('r',d.r*0.32).attr('fill',col).attr('fill-opacity',0.85);
  }else if(d.type==='tg'){
   const s=d.r*1.7;
   g.append('rect').attr('class','kg-shape').attr('x',-s/2).attr('y',-s/2).attr('width',s).attr('height',s).attr('rx',2.5).attr('fill',col).attr('fill-opacity',0.22).attr('stroke',col).attr('stroke-width',1.8).attr('stroke-opacity',0.8).style('filter','url(#kg-glow)');
   g.append('circle').attr('class','kg-dot').attr('r',d.r*0.3).attr('fill',col).attr('fill-opacity',0.85);
  }else if(d.type==='fd'){
   const s=d.r*1.35;
   g.append('polygon').attr('class','kg-shape').attr('points',`0,${-s} ${s},0 0,${s} ${-s},0`).attr('fill',col).attr('fill-opacity',0.26).attr('stroke',col).attr('stroke-width',1.8).attr('stroke-opacity',0.8).style('filter','url(#kg-glow)');
   g.append('circle').attr('class','kg-dot').attr('r',d.r*0.32).attr('fill',col).attr('fill-opacity',0.85);
  }else if(d.type==='im'){
   const s=d.r;let pts='';
   for(let i=0;i<6;i++){const a=Math.PI/6+i*Math.PI/3;pts+=(s*Math.cos(a))+','+(s*Math.sin(a))+' '}
   g.append('polygon').attr('class','kg-shape').attr('points',pts.trim()).attr('fill',col).attr('fill-opacity',0.24).attr('stroke',col).attr('stroke-width',1.8).attr('stroke-opacity',0.8).style('filter','url(#kg-glow)');
   g.append('circle').attr('class','kg-dot').attr('r',d.r*0.35).attr('fill',col).attr('fill-opacity',0.85);
  }
  /* Label — dy offset adjusted per shape (triangle extends further below center than a circle) */
  const isHub=d.type==='co'||d.type==='im';
  const lbl=d.label.length>22?d.label.slice(0,20)+'…':d.label;
  const labelDy=d.type==='dim'?d.r*0.75+12:d.r+14;
  g.append('text').attr('class','kg-node-lbl'+(isHub?' big':'')).attr('text-anchor','middle').attr('dy',labelDy).attr('font-family','Inter').attr('font-size',isHub?10.5:9.5).attr('font-weight',isHub?700:600).attr('fill',isHub?'var(--text)':'var(--textDim)').style('pointer-events','none').style('text-shadow','0 1px 4px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.7)').text(lbl);
 });

 /* Helpers */
 function getNeighbors(d){
  const s=new Set([d.id]);
  edges.forEach(e=>{
   const sid=typeof e.source==='string'?e.source:e.source.id;
   const tid=typeof e.target==='string'?e.target:e.target.id;
   if(sid===d.id)s.add(tid);
   if(tid===d.id)s.add(sid);
  });
  return s;
 }

 function applyFocus(hover){
  const focus=hover||(selKG?nodeMap[selKG.type+':'+selKG.id]:null);
  const any=!!focus;
  const nbr=focus?getNeighbors(focus):new Set();
  node.select('.kg-shape')
   .attr('fill-opacity',d=>{
    if(!any)return d.type==='co'?0.18:(d.type==='dim'?0.28:(d.type==='tg'?0.22:(d.type==='fd'?0.26:0.24)));
    if(focus&&d.id===focus.id)return 0.55;
    if(nbr.has(d.id))return 0.4;
    return 0.04;
   })
   .attr('stroke-opacity',d=>{if(!any)return 0.8;return nbr.has(d.id)?1:0.1})
   .attr('stroke-width',d=>{if(focus&&d.id===focus.id)return 2.8;return nbr.has(d.id)||!any?1.8:1.2});
  node.select('.kg-dot').attr('fill-opacity',d=>{if(!any)return 0.75;return nbr.has(d.id)?0.95:0.12});
  node.select('text').style('opacity',d=>{if(!any)return 1;return nbr.has(d.id)?1:0.12});
  link
   .attr('stroke-opacity',d=>{
    if(!any)return edgeStyle[d.kind].op;
    const sid=typeof d.source==='string'?d.source:d.source.id;
    const tid=typeof d.target==='string'?d.target:d.target.id;
    if(focus&&(sid===focus.id||tid===focus.id))return 0.92;
    return 0.04;
   })
   .attr('stroke-width',d=>{
    if(!any)return d.kind==='gap'?1.0:1.3;
    const sid=typeof d.source==='string'?d.source:d.source.id;
    const tid=typeof d.target==='string'?d.target:d.target.id;
    if(focus&&(sid===focus.id||tid===focus.id))return 2.2;
    return 0.6;
   });
  el.style('opacity',d=>{
   if(!any)return 0;
   const sid=typeof d.source==='string'?d.source:d.source.id;
   const tid=typeof d.target==='string'?d.target:d.target.id;
   return (focus&&(sid===focus.id||tid===focus.id))?1:0;
  });
 }

 /* Drag */
 let dragging=false;
 const drag=d3.drag()
  .on('start',(ev,d)=>{dragging=true;if(!ev.active)sim.alphaTarget(0.3).restart();d.fx=d.x;d.fy=d.y})
  .on('drag',(ev,d)=>{d.fx=ev.x;d.fy=ev.y})
  .on('end',(ev,d)=>{dragging=false;if(!ev.active)sim.alphaTarget(0);/* keep pinned where released */d.fx=ev.x;d.fy=ev.y;kgPositions[d.id]={x:d.x,y:d.y}});
 node.call(drag);

 /* Hover */
 node.on('mouseover',(ev,d)=>{if(dragging)return;applyFocus(d)})
  .on('mouseout',()=>{if(dragging)return;applyFocus()});

 /* Click to pin */
 node.on('click',(ev,d)=>{
  ev.stopPropagation();
  const t=d.type,id=d.id.split(':')[1];
  pickKG(t,id);
  applyFocus();
 });

 /* Click background to clear */
 svg.on('click',()=>{if(selKG){selKG=null;applyFocus();renderSide()}});

 /* Tick */
 sim.on('tick',()=>{
  /* Boundary clamp — safety net so no node escapes the canvas (e.g. isolated nodes under charge repulsion) */
  const pad=30;
  nodes.forEach(n=>{
   if(n.fx==null){
    const r=(n.r||12)+4;
    n.x=Math.max(pad+r,Math.min(W-pad-r,n.x));
    n.y=Math.max(pad+r,Math.min(H-pad-r,n.y));
   }
  });
  link.attr('d',d=>{const b=bezier(d);return `M${b.sx.toFixed(1)},${b.sy.toFixed(1)}Q${b.cx.toFixed(1)},${b.cy.toFixed(1)},${b.ex.toFixed(1)},${b.ey.toFixed(1)}`});
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
  el.attr('transform',d=>{const b=bezier(d);return `translate(${b.mx.toFixed(1)},${b.my.toFixed(1)})`});
  el.each(function(){const t=d3.select(this).select('text');const r=d3.select(this).select('rect');const bb=t.node()&&t.node().getBBox();if(bb)r.attr('x',bb.x-4).attr('y',bb.y-1.5).attr('width',bb.width+8).attr('height',bb.height+3)});
  /* Cache positions so they persist across re-renders */
  nodes.forEach(n=>{kgPositions[n.id]={x:n.x,y:n.y}});
 });

 /* Update hint */
 const hint=document.getElementById('kg-hint');
 if(hint)hint.textContent=`${nodes.length} nós · ${edges.length} ligações · arraste · scroll para zoom · clique para focar`;

 /* Initial zoom framing */
 setTimeout(()=>{svg.transition().duration(700).call(zoom.transform,d3.zoomIdentity.translate(W*0.02,H*0.02).scale(0.96))},100);

 kgD3Refs={applyFocus,sim,nodes,edges};
 if(selKG)applyFocus();
}

function sideKnowledgeSummary(){
 /* Hub analysis: node with highest degree */
 const {nodes,edges}=buildKG();
 const deg={};nodes.forEach(n=>deg[n.id]=0);
 edges.forEach(e=>{deg[e.s]=(deg[e.s]||0)+1;deg[e.t]=(deg[e.t]||0)+1});
 const topHubs=nodes.map(n=>({n,d:deg[n.id]||0})).sort((a,b)=>b.d-a.d).slice(0,5);
 const typeLabel={co:'Empresa',dim:'Dimensão',tg:'Alvo',fd:'Fundo',im:'Impacto'};

 let h='<div class="sn-group" style="color:var(--gold)"><div style="width:8px;height:8px;border-radius:4px;background:var(--gold)"></div>Knowledge graph</div>';
 h+='<div class="sn-title">Leitura estrutural</div>';
 h+=`<div class="sn-detail">${nodes.length} nós, ${edges.length} ligações. A topologia diz mais do que o score agregado — <em style="color:var(--gold);font-style:normal;font-weight:700">hubs são pontos de alavanca</em>. Onde há mais conexões, há maior efeito sistémico por intervenção.</div>`;

 h+='<div class="sn-meta">';
 h+=`<div class="sn-meta-item"><span class="sn-meta-label">Nós</span><span class="sn-meta-val">${nodes.length}</span></div>`;
 h+=`<div class="sn-meta-item"><span class="sn-meta-label">Ligações</span><span class="sn-meta-val">${edges.length}</span></div>`;
 const avgDeg=(edges.length*2/nodes.length).toFixed(1);
 h+=`<div class="sn-meta-item"><span class="sn-meta-label">Grau médio</span><span class="sn-meta-val">${avgDeg}</span></div>`;
 h+='</div>';

 h+='<div class="sn-sec"><div class="sn-sec-title">Hubs do sistema</div>';
 topHubs.forEach(({n,d})=>{
  const t=n.id.split(':');
  h+=`<div class="sn-edge" onclick="pickKG('${n.type}','${t[1]}')"><div class="sn-edge-dot" style="background:${n.c}"></div><div style="flex:1;min-width:0"><div class="sn-edge-name">${n.label}</div><div class="sn-edge-label">${typeLabel[n.type]}</div></div><span class="sn-edge-val">${d}</span></div>`;
 });
 h+='</div>';

 h+='<div class="sn-sec"><div class="sn-sec-title">Tipos de ligação</div>';
 const kinds=[
  ['addresses','Alvo → Dimensão','endereça',edges.filter(e=>e.kind==='addresses').length,'rgba(139,92,246,.6)'],
  ['belongs','Alvo → Empresa','pertence',edges.filter(e=>e.kind==='belongs').length,'rgba(148,163,184,.5)'],
  ['funded','Alvo → Fundo','financiado',edges.filter(e=>e.kind==='funded').length,'rgba(59,130,246,.6)'],
  ['impacts','Alvo → Impacto','gera',edges.filter(e=>e.kind==='impacts').length,'rgba(16,185,129,.6)'],
  ['gap','Empresa → Dim','gap crítico',edges.filter(e=>e.kind==='gap').length,'rgba(239,68,68,.45)']
 ];
 kinds.forEach(([k,lbl,desc,ct,col])=>{
  h+=`<div class="sn-edge"><div class="sn-edge-dot" style="background:${col}"></div><div style="flex:1;min-width:0"><div class="sn-edge-name">${lbl}</div><div class="sn-edge-label">${desc}</div></div><span class="sn-edge-val">${ct}</span></div>`;
 });
 h+='</div>';

 h+='<div class="sn-sec"><div class="sn-sec-title">Como ler</div>';
 h+='<div style="font-size:11.5px;color:var(--textDim);line-height:1.7">O alvo mais conectado é o alvo que, <em style="color:var(--text);font-style:normal;font-weight:700">ao ser executado</em>, ativa mais nós adjacentes — fundos, impactos, dimensões. O fundo mais conectado é o instrumento que cobre mais backlog. A dimensão mais conectada é onde o portfolio tem mais gaps críticos <em style="color:var(--textMut);font-style:normal">e</em> mais intervenções desenhadas.</div>';
 h+='</div>';
 return h;
}

function sideKnowledgeNode(){
 const {nodes,edges}=buildKG();
 const selId=selKG.type+':'+selKG.id;
 const node=nodes.find(n=>n.id===selId);
 if(!node)return sideKnowledgeSummary();
 const neighbors=[];
 edges.forEach(e=>{
  if(e.s===selId){const n=nodes.find(x=>x.id===e.t);if(n)neighbors.push({n,kind:e.kind,dir:'out'})}
  if(e.t===selId){const n=nodes.find(x=>x.id===e.s);if(n)neighbors.push({n,kind:e.kind,dir:'in'})}
 });
 const typeLabel={co:'Empresa',dim:'Dimensão',tg:'Alvo',fd:'Fundo',im:'Impacto'};
 const kindLabel={addresses:'endereça dimensão',belongs:'pertence a',funded:'financiado por',impacts:'gera impacto',gap:'gap crítico em'};

 let h=`<div class="sn-group" style="color:${node.c}"><div style="width:8px;height:8px;border-radius:4px;background:${node.c}"></div>${typeLabel[node.type]}</div>`;
 h+=`<div class="sn-title">${node.data.name||node.data.title||node.label}</div>`;
 /* Description by type */
 let descText='';
 if(node.type==='co')descText=`${node.data.sector} · ${node.data.hq}`;
 else if(node.type==='dim')descText=node.data.desc;
 else if(node.type==='tg')descText=`${CMAP[node.data.co].name} · ${DMAP[node.data.dim].name}`;
 else if(node.type==='fd')descText=node.data.fit;
 else if(node.type==='im')descText=node.data.desc;
 h+=`<div class="sn-detail">${descText}</div>`;

 /* Type-specific meta */
 if(node.type==='co'){
  h+='<div class="sn-meta">';
  h+=`<div class="sn-meta-item"><span class="sn-meta-label">Readiness</span><span class="sn-meta-val" style="color:${scoreColor(node.data.score)}">${node.data.score}/100</span></div>`;
  h+=`<div class="sn-meta-item"><span class="sn-meta-label">Receita</span><span class="sn-meta-val">${node.data.rev}</span></div>`;
  h+=`<div class="sn-meta-item"><span class="sn-meta-label">Investimento</span><span class="sn-meta-val">${node.data.invest}</span></div>`;
  h+='</div>';
 }else if(node.type==='tg'){
  h+='<div class="sn-meta">';
  h+=`<div class="sn-meta-item"><span class="sn-meta-label">Investimento</span><span class="sn-meta-val">${node.data.invest}</span></div>`;
  h+=`<div class="sn-meta-item"><span class="sn-meta-label">Timeline</span><span class="sn-meta-val">${node.data.timeline}</span></div>`;
  h+=`<div class="sn-meta-item"><span class="sn-meta-label">Prioridade</span><span class="sn-meta-val" style="color:${node.data.priority==='P1'?'var(--danger)':'var(--warn)'}">${node.data.priority}</span></div>`;
  h+='</div>';
 }else if(node.type==='fd'){
  h+='<div class="sn-meta">';
  h+=`<div class="sn-meta-item"><span class="sn-meta-label">Gestor</span><span class="sn-meta-val" style="font-size:11.5px">${node.data.managed}</span></div>`;
  h+=`<div class="sn-meta-item"><span class="sn-meta-label">Teto</span><span class="sn-meta-val" style="font-size:11.5px">${node.data.max.split('·')[0]}</span></div>`;
  h+='</div>';
 }else if(node.type==='dim'){
  const avg=COMPANIES.reduce((a,c)=>a+c.s[node.data.id],0)/COMPANIES.length;
  h+='<div class="sn-meta">';
  h+=`<div class="sn-meta-item"><span class="sn-meta-label">Média portfolio</span><span class="sn-meta-val" style="color:${scoreColor(avg)}">${avg.toFixed(0)}/100</span></div>`;
  h+=`<div class="sn-meta-item"><span class="sn-meta-label">Grau</span><span class="sn-meta-val">${neighbors.length}</span></div>`;
  h+='</div>';
 }else{
  h+='<div class="sn-meta">';
  h+=`<div class="sn-meta-item"><span class="sn-meta-label">Grau no grafo</span><span class="sn-meta-val">${neighbors.length}</span></div>`;
  h+='</div>';
 }

 /* Group neighbors by type */
 const byType={};
 neighbors.forEach(({n,kind})=>{
  if(!byType[n.type])byType[n.type]=[];
  byType[n.type].push({n,kind});
 });
 const order=['co','dim','tg','fd','im'].filter(t=>byType[t]);
 order.forEach(t=>{
  h+=`<div class="sn-sec"><div class="sn-sec-title">${typeLabel[t]}s vizinhos <span class="sn-sec-count">${byType[t].length}</span></div>`;
  byType[t].forEach(({n,kind})=>{
   const id=n.id.split(':')[1];
   h+=`<div class="sn-edge" onclick="pickKG('${n.type}','${id}')"><div class="sn-edge-dot" style="background:${n.c}"></div><div style="flex:1;min-width:0"><div class="sn-edge-name">${n.label}</div><div class="sn-edge-label">${kindLabel[kind]||''}</div></div></div>`;
  });
  h+='</div>';
 });

 /* Cross-nav */
 h+='<div class="sn-sec"><div class="sn-sec-title">Ver nas outras vistas</div>';
 if(node.type==='co')h+=`<div class="sn-edge" onclick="selCo='${node.data.id}';goLayer(2);renderSide()"><div class="sn-edge-dot" style="background:var(--accent)"></div><div style="flex:1"><div class="sn-edge-name">Abrir diagnóstico</div></div></div>`;
 if(node.type==='tg')h+=`<div class="sn-edge" onclick="goLayer(3);setTimeout(()=>{selTg='${node.data.id}';renderContent();renderSide()},50)"><div class="sn-edge-dot" style="background:var(--accent)"></div><div style="flex:1"><div class="sn-edge-name">Ver alvo no backlog</div></div></div>`;
 if(node.type==='fd')h+=`<div class="sn-edge" onclick="goLayer(4);setTimeout(()=>{selFd='${node.data.id}';renderContent();renderSide()},50)"><div class="sn-edge-dot" style="background:var(--accent)"></div><div style="flex:1"><div class="sn-edge-name">Ver ficha do fundo</div></div></div>`;
 if(node.type==='dim')h+=`<div class="sn-edge" onclick="selDim='${node.data.id}';goLayer(2);renderSide()"><div class="sn-edge-dot" style="background:var(--accent)"></div><div style="flex:1"><div class="sn-edge-name">Ver dimensão no diagnóstico</div></div></div>`;
 h+='</div>';

 return h;
}

/* ============ INIT ============ */
goLayer(0);
</script>
